; NosebleedCam 1.0 - the Nitrous nosebleed camera without replacing nba2k14.exe
[NosebleedCam]
; 0 = off (the game's own Nosebleeds camera)
Enabled=1
; 1 = the stock nba2k14.exe lens, with the Zoom setting's range set by ZoomFar / ZoomClose below
; 0 = the full Nitrous lens values instead (ZoomFar / ZoomClose are then not used)
KeepStockZoom=1
; lens at the two ends of the camera menu's Zoom setting: ZoomFar = lowest Zoom, ZoomClose = Zoom 10.
; Bigger = closer. Stock exe: 45 / 60 (Zoom 10 is still far away with the Nosebleeds camera).
; Default 58 / 100: lowest Zoom = about the stock Zoom 10 view, Zoom 10 is much closer.
; Change them and restart the game. 0 = the stock value.
ZoomFar=58
ZoomClose=100
